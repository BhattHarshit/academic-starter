{{ define "main" }}
<section class="max-w-5xl mx-auto px-6 py-8 space-y-8">
  <h1 class="page-title text-4xl font-bold text-gray-900 dark:text-gray-100">{{ .Title }}</h1>
  {{ if .Content }}
  <div class="content prose dark:prose-invert max-w-none text-lg text-gray-700 dark:text-gray-300">{{ .Content }}</div>
  {{ end }}

  {{ if .Pages }}
  <div class="space-y-6">
    {{ range .Pages.ByWeight }}
    <article class="content-card border border-gray-300 dark:border-gray-700 rounded-lg p-6 transition duration-300">
      <h2 class="text-2xl font-semibold mb-3">
        <a href="{{ .RelPermalink }}" class="content-link">{{ .Title }}</a>
      </h2>
      <div class="content prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300">
        {{ if .Truncated }}{{ .Summary }}{{ else }}{{ .Content }}{{ end }}
      </div>
      {{ if .Truncated }}<a href="{{ .RelPermalink }}" class="content-link inline-flex mt-4">Read more →</a>{{ end }}
    </article>
    {{ end }}
  </div>
  {{ end }}
</section>
{{ end }}
