{{ define "main" }}
<section class="max-w-5xl mx-auto px-6 py-8">
  <h1 class="page-title text-4xl font-bold mb-6 text-gray-900 dark:text-gray-100">{{ .Title }}</h1>
  {{ if and (.Parent) (ne .Parent.RelPermalink ("" | relURL)) }}
  <a href="{{ .Parent.RelPermalink }}" class="content-link inline-flex items-center mb-6">
    <i class="fas fa-arrow-left mr-2" aria-hidden="true"></i> Back to {{ .Parent.Title }}
  </a>
  {{ end }}
  <div class="content prose dark:prose-invert max-w-none">{{ .Content }}</div>
</section>
{{ end }}
